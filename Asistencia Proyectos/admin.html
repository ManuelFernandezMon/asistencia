<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin – Asistencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg:      #0C0C0E;
    --surface: #131316;
    --raised:  #1A1A1F;
    --border:  #252529;
    --border2: #2E2E35;
    --text:    #EEEEF0;
    --sub:     #7878A0;
    --orange:  #FF4D00;
    --orange2: #FF7A40;
    --success: #00E090;
    --error:   #FF3B5C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.3;
    pointer-events: none;
  }

  /* ── LOGIN ────────────────────────────────────────────────── */
  #loginScreen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; padding: 24px;
  }

  .login-wrap {
    width: 100%; max-width: 400px;
    animation: fadeUp 0.5s ease both;
  }

  .login-top {
    text-align: center;
    margin-bottom: 32px;
  }

  .login-mark {
    display: inline-flex;
    align-items: center; justify-content: center;
    width: 72px; height: 72px;
    background: linear-gradient(135deg, var(--orange), var(--orange2));
    border-radius: 22px;
    font-size: 32px;
    margin-bottom: 20px;
    box-shadow: 0 12px 40px rgba(255,77,0,0.3);
  }

  .login-top h1 {
    font-family: 'Syne', sans-serif;
    font-size: 26px; font-weight: 800;
    letter-spacing: -0.5px; margin-bottom: 6px;
  }

  .login-top p { color: var(--sub); font-size: 13px; font-weight: 300; }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
  }

  .login-field { margin-bottom: 16px; }

  .login-field label {
    display: block;
    font-size: 11px; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--sub); margin-bottom: 8px;
  }

  .login-field input {
    width: 100%; background: var(--raised);
    border: 1px solid var(--border2); border-radius: 12px;
    padding: 13px 16px; font-size: 15px; color: var(--text);
    font-family: 'DM Sans', sans-serif; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .login-field input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255,77,0,0.1); }

  .login-btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--orange), var(--orange2));
    color: white; border: none; border-radius: 12px;
    font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700;
    letter-spacing: 0.5px; cursor: pointer; margin-top: 8px;
    transition: opacity 0.2s, transform 0.15s;
    box-shadow: 0 4px 20px rgba(255,77,0,0.3);
  }
  .login-btn:hover  { opacity: 0.9; }
  .login-btn:active { transform: scale(0.98); }

  .login-error {
    display: none; margin-top: 14px;
    background: rgba(255,59,92,0.08);
    border: 1px solid rgba(255,59,92,0.25);
    border-radius: 10px; padding: 11px 14px;
    color: var(--error); font-size: 13px; text-align: center;
  }

  /* ── ADMIN SHELL ──────────────────────────────────────────── */
  #adminContent { display: none; }

  /* TOP BAR */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(12,12,14,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
  }

  .topbar-brand {
    display: flex; align-items: center; gap: 12px;
  }

  .topbar-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--orange), var(--orange2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .topbar-title {
    font-family: 'Syne', sans-serif;
    font-size: 16px; font-weight: 700; letter-spacing: -0.3px;
  }

  .topbar-right { display: flex; align-items: center; gap: 20px; }

  .topbar-clock {
    font-size: 13px; font-weight: 500;
    color: var(--sub); font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
  }

  .topbar-clock span { color: var(--text); }

  .logout-btn {
    display: flex; align-items: center; gap: 6px;
    background: var(--raised); border: 1px solid var(--border2);
    color: var(--sub); border-radius: 8px; padding: 7px 14px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: color 0.2s, border-color 0.2s;
  }
  .logout-btn:hover { color: var(--error); border-color: rgba(255,59,92,0.4); }

  /* MAIN */
  .main { padding: 36px 32px; max-width: 1040px; margin: 0 auto; }

  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--sub); margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } .topbar { padding: 0 16px; } .main { padding: 24px 16px; } }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 20px;
    padding: 24px;
    position: relative;
  }

  .card-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 20px; padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .card-icon {
    width: 32px; height: 32px;
    background: rgba(255,77,0,0.1);
    border: 1px solid rgba(255,77,0,0.2);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 14px; font-weight: 700; letter-spacing: 0.3px;
  }

  /* QR */
  .qr-box {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
  }

  .qr-footer {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }

  .qr-url {
    font-size: 11px; color: var(--sub);
    font-family: monospace;
    word-break: break-all;
    flex: 1;
    line-height: 1.4;
  }

  /* FIELDS */
  .field { margin-bottom: 14px; }

  .field label {
    display: block; font-size: 11px; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--sub); margin-bottom: 7px;
  }

  input[type="text"], input[type="number"], input[type="url"], input[type="password"] {
    width: 100%; background: var(--raised);
    border: 1px solid var(--border2); border-radius: 10px;
    padding: 11px 14px; font-size: 14px; color: var(--text);
    font-family: 'DM Sans', sans-serif; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255,77,0,0.08); }

  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn-primary {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, var(--orange), var(--orange2));
    color: white; border: none; border-radius: 12px;
    font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700;
    letter-spacing: 0.5px; cursor: pointer; margin-top: 10px;
    transition: opacity 0.2s; box-shadow: 0 4px 16px rgba(255,77,0,0.25);
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

  .btn-ghost {
    background: var(--raised); border: 1px solid var(--border2);
    color: var(--text); border-radius: 9px; padding: 8px 14px;
    font-size: 12px; font-weight: 500; cursor: pointer;
    font-family: 'DM Sans', sans-serif; white-space: nowrap;
    transition: border-color 0.2s;
  }
  .btn-ghost:hover { border-color: var(--orange); color: var(--orange2); }

  .msg { font-size: 12px; text-align: center; margin-top: 10px; padding: 9px 12px; border-radius: 9px; display: none; }
  .msg.ok  { background: rgba(0,224,144,0.07); color: var(--success); border: 1px solid rgba(0,224,144,0.2); display: block; }
  .msg.err { background: rgba(255,59,92,0.07); color: var(--error);   border: 1px solid rgba(255,59,92,0.2);  display: block; }

  /* EMPLEADOS */
  .emp-add-row {
    display: grid; grid-template-columns: 1fr 120px auto;
    gap: 10px; align-items: end; margin-bottom: 20px;
  }
  @media (max-width: 500px) { .emp-add-row { grid-template-columns: 1fr 1fr; } .emp-add-row .btn-add { grid-column: 1 / -1; } }

  .btn-add {
    padding: 11px 16px;
    background: rgba(255,77,0,0.1);
    border: 1px solid rgba(255,77,0,0.3);
    color: var(--orange2); border-radius: 10px;
    font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
    cursor: pointer; white-space: nowrap; transition: background 0.2s;
  }
  .btn-add:hover { background: rgba(255,77,0,0.18); }

  .emp-grid { display: flex; flex-direction: column; gap: 8px; }

  .emp-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--raised); border: 1px solid var(--border);
    border-radius: 12px; padding: 13px 16px;
    transition: border-color 0.2s;
  }
  .emp-row:hover { border-color: var(--border2); }

  .emp-left { display: flex; align-items: center; gap: 12px; }

  .emp-avatar {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--orange), var(--orange2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 14px;
    color: white; flex-shrink: 0;
  }

  .emp-name { font-weight: 600; font-size: 14px; }
  .emp-pin  { font-size: 12px; color: var(--sub); margin-top: 1px; }

  .btn-remove {
    background: none; border: 1px solid transparent;
    color: var(--sub); border-radius: 8px; padding: 6px 10px;
    font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
  }
  .btn-remove:hover { color: var(--error); border-color: rgba(255,59,92,0.3); background: rgba(255,59,92,0.06); }

  .emp-empty {
    text-align: center; padding: 32px 16px;
    color: var(--sub); font-size: 13px; font-weight: 300;
    border: 1px dashed var(--border); border-radius: 14px;
  }

  .emp-msg { font-size: 12px; text-align: center; margin-bottom: 12px; padding: 9px 12px; border-radius: 9px; display: none; }
  .emp-msg.ok  { background: rgba(0,224,144,0.07); color: var(--success); border: 1px solid rgba(0,224,144,0.2); display: block; }
  .emp-msg.err { background: rgba(255,59,92,0.07); color: var(--error);   border: 1px solid rgba(255,59,92,0.2);  display: block; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-wrap">
    <div class="login-top">
      <div class="login-mark">🏗️</div>
      <h1>Panel de Administración</h1>
      <p>Sistema de Asistencia · Construcción</p>
    </div>
    <div class="login-card">
      <div class="login-field">
        <label>Usuario</label>
        <input type="text" id="loginUser" placeholder="Ingresa tu usuario" autocomplete="username" onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <div class="login-field">
        <label>Contraseña</label>
        <input type="password" id="loginPass" placeholder="Ingresa tu contraseña" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <button class="login-btn" onclick="doLogin()">Iniciar Sesión</button>
      <div class="login-error" id="loginError">❌ Usuario o contraseña incorrectos</div>
    </div>
  </div>
</div>

<!-- ADMIN -->
<div id="adminContent">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-brand">
      <div class="topbar-icon">🏗️</div>
      <div class="topbar-title">Panel de Asistencia</div>
    </div>
    <div class="topbar-right">
      <div class="topbar-clock"><span id="clockDisplay">--:--:--</span></div>
      <button class="logout-btn" onclick="doLogout()">
        <span>↩</span> Salir
      </button>
    </div>
  </div>

  <div class="main">

    <!-- ROW 1: QR + CONFIG -->
    <div class="section-title">Configuración del sistema</div>
    <div class="grid-2">

      <!-- QR -->
      <div class="card">
        <div class="card-header">
          <div class="card-icon">📲</div>
          <div class="card-title">Código QR de Acceso</div>
        </div>
        <div class="qr-box" id="qrContainer"></div>
        <div class="qr-footer">
          <div class="qr-url" id="urlDisplay">—</div>
          <button class="btn-ghost" onclick="printQR()">🖨️ Imprimir</button>
        </div>
      </div>

      <!-- CONFIG -->
      <div class="card">
        <div class="card-header">
          <div class="card-icon">⚙️</div>
          <div class="card-title">Parámetros del Proyecto</div>
        </div>

        <div class="field">
          <label>URL del Apps Script</label>
          <input type="url" id="cfgScript" placeholder="https://script.google.com/macros/s/...">
        </div>
        <div class="field">
          <label>Nombre del Proyecto</label>
          <input type="text" id="cfgName" placeholder="Ej: Torre Residencial Norte">
        </div>
        <div class="field">
          <label>URL del Checkin (index.html)</label>
          <input type="url" id="cfgUrl" placeholder="https://tu-sitio.netlify.app/index.html">
        </div>
        <div class="field">
          <label>Coordenadas GPS</label>
          <div class="row-2">
            <input type="number" id="cfgLat" placeholder="Latitud" step="0.000001">
            <input type="number" id="cfgLng" placeholder="Longitud" step="0.000001">
          </div>
        </div>
        <div class="field">
          <label>Radio permitido (metros)</label>
          <input type="number" id="cfgRadius" placeholder="150">
        </div>
        <div class="field">
          <label>Horario de Entrada</label>
          <div class="row-2">
            <input type="number" id="cfgEntradaFrom" placeholder="Desde (ej: 6)" min="0" max="23">
            <input type="number" id="cfgEntradaTo"   placeholder="Hasta (ej: 9)" min="0" max="23">
          </div>
        </div>
        <div class="field">
          <label>Horario de Salida</label>
          <div class="row-2">
            <input type="number" id="cfgSalidaFrom" placeholder="Desde (ej: 16)" min="0" max="23">
            <input type="number" id="cfgSalidaTo"   placeholder="Hasta (ej: 19)" min="0" max="23">
          </div>
        </div>

        <button class="btn-primary" id="saveBtn" onclick="saveConfig()">Guardar y Aplicar</button>
        <div class="msg" id="saveMsg"></div>
      </div>

    </div>

    <!-- ROW 2: EMPLEADOS -->
    <div class="section-title" style="margin-top:8px;">Gestión de empleados</div>
    <div class="card">
      <div class="card-header">
        <div class="card-icon">👷</div>
        <div class="card-title">Empleados Registrados</div>
      </div>

      <div class="emp-add-row">
        <div class="field" style="margin:0">
          <label>Nombre completo</label>
          <input type="text" id="empName" placeholder="Ej: Juan García López">
        </div>
        <div class="field" style="margin:0">
          <label>PIN (4 dígitos)</label>
          <input type="password" id="empPin" placeholder="••••" maxlength="4" inputmode="numeric">
        </div>
        <button class="btn-add" onclick="addEmployee()">+ Agregar</button>
      </div>

      <div class="emp-msg" id="empMsg"></div>
      <div class="emp-grid" id="empGrid">
        <div class="emp-empty">Cargando empleados...</div>
      </div>
    </div>

  </div>
</div>

<script>
const CREDENTIALS = { user: "AdminManuel", pass: "Ma220503nu22" };

// LOGIN
function doLogin() {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (user === CREDENTIALS.user && pass === CREDENTIALS.pass) {
    sessionStorage.setItem('adminAuth', 'ok');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
    initAdmin();
  } else {
    const e = document.getElementById('loginError');
    e.style.display = 'block';
    document.getElementById('loginPass').value = '';
    setTimeout(() => e.style.display = 'none', 3000);
  }
}

function doLogout() {
  sessionStorage.removeItem('adminAuth');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminContent').style.display = 'none';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
}

if (sessionStorage.getItem('adminAuth') === 'ok') {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminContent').style.display = 'block';
}

// ── SUPABASE ──────────────────────────────────────────────
const SB_URL = "https://ucuxfhpncjhrbgbitveg.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjdXhmaHBuY2pocmJnYml0dmVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MDQxMzcsImV4cCI6MjA5Mjk4MDEzN30.M7GQL5tcQbN_BG7CghZp3Ny7GFaijvFL3ZYnrV4dDys";

const sbHeaders = {
  "Content-Type": "application/json",
  "apikey": SB_KEY,
  "Authorization": "Bearer " + SB_KEY
};

async function sbFetch(path, options = {}) {
  try {
    const res = await fetch(SB_URL + "/rest/v1/" + path, {
      ...options,
      headers: { ...sbHeaders, ...(options.headers || {}) }
    });
    return res.ok ? await res.json() : null;
  } catch(e) { return null; }
}

// CONFIG
let cfg = {
  scriptUrl: "", name: "Proyecto Principal",
  checkinUrl: window.location.origin + "/index.html",
  lat: 19.4326, lng: -99.1332, radius: 150,
  entradaFrom: 6, entradaTo: 9, salidaFrom: 16, salidaTo: 19
};

try { const s = JSON.parse(localStorage.getItem('assistConfig')); if (s) cfg = {...cfg, ...s}; } catch(e) {}

function loadFields() {
  document.getElementById('cfgScript').value      = cfg.scriptUrl;
  document.getElementById('cfgName').value        = cfg.name;
  document.getElementById('cfgUrl').value         = cfg.checkinUrl;
  document.getElementById('cfgLat').value         = cfg.lat;
  document.getElementById('cfgLng').value         = cfg.lng;
  document.getElementById('cfgRadius').value      = cfg.radius;
  document.getElementById('cfgEntradaFrom').value = cfg.entradaFrom;
  document.getElementById('cfgEntradaTo').value   = cfg.entradaTo;
  document.getElementById('cfgSalidaFrom').value  = cfg.salidaFrom;
  document.getElementById('cfgSalidaTo').value    = cfg.salidaTo;
}

async function saveConfig() {
  const scriptUrl = document.getElementById('cfgScript').value.trim();
  if (!scriptUrl) { showMsg('saveMsg', '❌ Pega primero la URL del Apps Script.', 'err'); return; }

  cfg.scriptUrl   = scriptUrl;
  cfg.name        = document.getElementById('cfgName').value || cfg.name;
  cfg.checkinUrl  = document.getElementById('cfgUrl').value || cfg.checkinUrl;
  cfg.lat         = parseFloat(document.getElementById('cfgLat').value) || cfg.lat;
  cfg.lng         = parseFloat(document.getElementById('cfgLng').value) || cfg.lng;
  cfg.radius      = parseInt(document.getElementById('cfgRadius').value) || cfg.radius;
  cfg.entradaFrom = parseInt(document.getElementById('cfgEntradaFrom').value) ?? cfg.entradaFrom;
  cfg.entradaTo   = parseInt(document.getElementById('cfgEntradaTo').value)   ?? cfg.entradaTo;
  cfg.salidaFrom  = parseInt(document.getElementById('cfgSalidaFrom').value)  ?? cfg.salidaFrom;
  cfg.salidaTo    = parseInt(document.getElementById('cfgSalidaTo').value)    ?? cfg.salidaTo;
  localStorage.setItem('assistConfig', JSON.stringify(cfg));

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Guardando...';
  showMsg('saveMsg', '⏳ Enviando a Google Sheets...', 'ok');

  try {
    // Guardar en Apps Script (→ Google Sheets)
    fetch(scriptUrl, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'saveConfig', projectName: cfg.name,
        projectLat: cfg.lat, projectLng: cfg.lng, radiusMeters: cfg.radius,
        entradaFrom: cfg.entradaFrom, entradaTo: cfg.entradaTo,
        salidaFrom: cfg.salidaFrom, salidaTo: cfg.salidaTo
      })
    });

    // Guardar en Supabase (upsert por clave)
    const configRows = [
      { clave: 'projectName',  valor: String(cfg.name) },
      { clave: 'projectLat',   valor: String(cfg.lat) },
      { clave: 'projectLng',   valor: String(cfg.lng) },
      { clave: 'radiusMeters', valor: String(cfg.radius) },
      { clave: 'entradaFrom',  valor: String(cfg.entradaFrom) },
      { clave: 'entradaTo',    valor: String(cfg.entradaTo) },
      { clave: 'salidaFrom',   valor: String(cfg.salidaFrom) },
      { clave: 'salidaTo',     valor: String(cfg.salidaTo) }
    ];

    await sbFetch("config?on_conflict=clave", {
      method: 'POST',
      headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(configRows)
    });

    showMsg('saveMsg', '✅ Configuración guardada en Sheets y Supabase.', 'ok');
    generateQR();
    setTimeout(() => document.getElementById('saveMsg').style.display = 'none', 4000);
  } catch(err) {
    showMsg('saveMsg', '❌ Error al conectar. Verifica la URL.', 'err');
  }
  btn.disabled = false; btn.textContent = 'Guardar y Aplicar';
}

// QR
function generateQR() {
  const url = cfg.checkinUrl || (window.location.origin + '/index.html');
  const c   = document.getElementById('qrContainer');
  c.innerHTML = '';
  new QRCode(c, { text: url, width: 200, height: 200, colorDark: '#000', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.M });
  document.getElementById('urlDisplay').textContent = url;
}

function printQR() {
  const canvas = document.querySelector('#qrContainer canvas');
  if (!canvas) return;
  const img = canvas.toDataURL('image/png');
  const win = window.open('', '_blank');
  win.document.write(`<html><head><title>QR · ${cfg.name}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'DM Sans',sans-serif;}
    .wrap{border:2px solid #111;border-radius:24px;padding:32px;text-align:center;max-width:340px;}
    .logo{font-size:40px;margin-bottom:12px;}
    h2{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;margin-bottom:4px;}
    img{width:260px;height:260px;margin:16px 0;border-radius:12px;}
    .instr{font-size:13px;color:#555;margin-bottom:8px;}
    .hours{font-size:11px;color:#999;background:#f5f5f5;border-radius:8px;padding:6px 12px;display:inline-block;}
  </style></head><body>
  <div class="wrap">
    <div class="logo">🏗️</div>
    <h2>${cfg.name}</h2>
    <img src="${img}"/>
    <p class="instr">Escanea para registrar tu asistencia</p>
    <span class="hours">Entrada ${cfg.entradaFrom}:00–${cfg.entradaTo}:00 · Salida ${cfg.salidaFrom}:00–${cfg.salidaTo}:00</span>
  </div>
  <script>window.print();<\/script></body></html>`);
  win.document.close();
}

// EMPLEADOS
let employees = [];

async function loadEmployees() {
  // Primero intenta Supabase
  const sbEmp = await sbFetch("empleados?select=id,nombre,pin&activo=eq.true");
  if (sbEmp && sbEmp.length > 0) {
    employees = sbEmp;
    renderEmployees();
    return;
  }
  // Fallback: Apps Script
  if (!cfg.scriptUrl) { renderEmployees(); return; }
  try {
    const res  = await fetch(cfg.scriptUrl + '?action=getEmployees&t=' + Date.now());
    const data = await res.json();
    employees  = data.employees || [];
  } catch(e) { employees = []; }
  renderEmployees();
}

function getInitials(name) {
  return name.split(' ').slice(0,2).map(w => w[0]?.toUpperCase() || '').join('');
}

function togglePin(id, pin) {
  const el  = document.getElementById('pin-' + id);
  const btn = document.getElementById('eye-' + id);
  if (!el) return;
  const hidden = el.textContent.includes('•');
  el.textContent  = hidden ? 'PIN: ' + pin : 'PIN: ' + '•'.repeat(pin.length);
  el.style.color  = hidden ? 'var(--orange2)' : '';
  btn.textContent = hidden ? '🙈' : '👁';
}

function renderEmployees() {
  const grid = document.getElementById('empGrid');
  if (!employees.length) {
    grid.innerHTML = '<div class="emp-empty">Aún no hay empleados. Agrega el primero arriba.</div>';
    return;
  }
  grid.innerHTML = employees.map(emp => `
    <div class="emp-row">
      <div class="emp-left">
        <div class="emp-avatar">${getInitials(emp.nombre)}</div>
        <div>
          <div class="emp-name">${emp.nombre}</div>
          <div class="emp-pin" id="pin-${emp.id}">PIN: ${'•'.repeat(emp.pin.length)}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn-remove" style="color:var(--sub);" onclick="togglePin('${emp.id}','${emp.pin}')" id="eye-${emp.id}" title="Ver PIN">👁</button>
        <button class="btn-remove" onclick="removeEmployee('${emp.id}')">Eliminar</button>
      </div>
    </div>
  `).join('');
}

async function addEmployee() {
  if (!cfg.scriptUrl) { showMsg('empMsg', '❌ Guarda primero la URL del Apps Script.', 'err'); return; }
  const name = document.getElementById('empName').value.trim();
  const pin  = document.getElementById('empPin').value.trim();
  if (!name)                       { showMsg('empMsg', '❌ Escribe el nombre del empleado.', 'err'); return; }
  if (!pin || pin.length < 4 || isNaN(pin)) { showMsg('empMsg', '❌ El PIN debe ser de 4 dígitos numéricos.', 'err'); return; }

  const id = Date.now().toString();
  showMsg('empMsg', '⏳ Guardando...', 'ok');

  try {
    // Guardar en Apps Script
    fetch(cfg.scriptUrl, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'saveEmployee', id, nombre: name, pin })
    });
    // Guardar en Supabase
    await sbFetch("empleados", {
      method: 'POST',
      headers: { "Prefer": "return=minimal" },
      body: JSON.stringify({ id, nombre: name, pin, activo: true })
    });
    employees.push({ id, nombre: name, pin });
    renderEmployees();
    document.getElementById('empName').value = '';
    document.getElementById('empPin').value  = '';
    showMsg('empMsg', `✅ ${name} agregado correctamente.`, 'ok');
    setTimeout(() => document.getElementById('empMsg').style.display = 'none', 3000);
  } catch(err) {
    showMsg('empMsg', '❌ Error al guardar. Intenta de nuevo.', 'err');
  }
}

async function removeEmployee(id) {
  if (!confirm('¿Eliminar este empleado?')) return;
  try {
    // Eliminar de Apps Script
    fetch(cfg.scriptUrl, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'deleteEmployee', id })
    });
    // Eliminar de Supabase (marcar como inactivo)
    await sbFetch("empleados?id=eq." + id, {
      method: 'PATCH',
      headers: { "Prefer": "return=minimal" },
      body: JSON.stringify({ activo: false })
    });
    employees = employees.filter(e => e.id !== id);
    renderEmployees();
  } catch(err) { alert('Error al eliminar.'); }
}

// HELPERS
function showMsg(elId, msg, type) {
  const el = document.getElementById(elId);
  el.textContent = msg; el.className = (elId === 'empMsg' ? 'emp-msg ' : 'msg ') + type;
  el.style.display = 'block';
}

function updateClock() {
  const el = document.getElementById('clockDisplay');
  if (el) el.textContent = new Date().toLocaleTimeString('es-MX');
}

function initAdmin() {
  loadFields(); generateQR(); loadEmployees();
  updateClock(); setInterval(updateClock, 1000);
}

if (sessionStorage.getItem('adminAuth') === 'ok') initAdmin();
</script>
