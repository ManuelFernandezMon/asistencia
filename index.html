<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Asistencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0C0C0E;--surface:#131316;--raised:#1A1A1F;--border:#252529;--border2:#2E2E35;--text:#EEEEF0;--sub:#8888A0;--orange:#FF4D00;--orange2:#FF7A40;--success:#00E090;--error:#FF3B5C;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;position:relative;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:40px 40px;opacity:0.35;pointer-events:none;}
  body::after{content:'';position:fixed;top:-200px;right:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(255,77,0,0.08) 0%,transparent 70%);pointer-events:none;}

  .header{text-align:center;margin-bottom:36px;position:relative;z-index:1;}
  .brand-mark{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;background:linear-gradient(135deg,var(--orange),var(--orange2));border-radius:18px;font-size:28px;margin-bottom:16px;box-shadow:0 8px 32px rgba(255,77,0,0.3);}
  .header h1{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;letter-spacing:-0.5px;line-height:1.1;margin-bottom:6px;}
  .header p{color:var(--sub);font-size:14px;font-weight:300;}

  .card{background:var(--surface);border:1px solid var(--border2);border-radius:24px;padding:28px;width:100%;max-width:400px;position:relative;z-index:1;box-shadow:0 24px 60px rgba(0,0,0,0.5);}

  .schedule-badge{display:flex;align-items:center;gap:12px;background:rgba(255,77,0,0.06);border:1px solid rgba(255,77,0,0.2);border-radius:14px;padding:14px 16px;margin-bottom:24px;}
  .badge-dot{width:8px;height:8px;background:var(--orange);border-radius:50%;flex-shrink:0;box-shadow:0 0 8px var(--orange);animation:pulse 2s ease infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.6;transform:scale(0.8);}}
  .badge-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--sub);font-weight:500;}
  .badge-val{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--orange);margin-top:1px;}

  .field{margin-bottom:18px;}
  .field-label{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--sub);margin-bottom:8px;display:block;}
  select,input[type="password"]{width:100%;background:var(--raised);border:1px solid var(--border2);border-radius:12px;padding:14px 16px;font-size:15px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s;appearance:none;}
  select:focus,input[type="password"]:focus{border-color:var(--orange);}
  input[type="password"]{font-size:24px;letter-spacing:8px;text-align:center;}

  .camera-wrap{border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;position:relative;}
  #videoEl{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1);}
  .photo-preview{width:100%;height:100%;object-fit:cover;display:none;border-radius:14px;}
  .camera-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .corners{width:80px;height:80px;position:relative;}
  .corners::before,.corners::after,.cb,.cl{content:'';position:absolute;width:20px;height:20px;border-color:rgba(255,77,0,0.7);border-style:solid;}
  .corners::before{top:0;left:0;border-width:2px 0 0 2px;}
  .corners::after{top:0;right:0;border-width:2px 2px 0 0;}
  .cb{bottom:0;right:0;border-width:0 2px 2px 0;}
  .cl{bottom:0;left:0;border-width:0 0 2px 2px;}
  .camera-hint{font-size:12px;color:var(--sub);text-align:center;margin-top:8px;}

  .btn-main{width:100%;padding:16px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:white;border:none;border-radius:14px;font-family:'Syne',sans-serif;font-size:17px;font-weight:700;letter-spacing:1px;cursor:pointer;margin-top:8px;box-shadow:0 4px 20px rgba(255,77,0,0.35);}
  .btn-main:active{transform:scale(0.98);}
  .btn-main:disabled{opacity:0.35;cursor:not-allowed;box-shadow:none;}

  .status{margin-top:16px;padding:13px 16px;border-radius:12px;font-size:13px;font-weight:500;display:none;text-align:center;line-height:1.4;}
  .status.success{background:rgba(0,224,144,0.08);color:var(--success);border:1px solid rgba(0,224,144,0.25);display:block;}
  .status.error{background:rgba(255,59,92,0.08);color:var(--error);border:1px solid rgba(255,59,92,0.25);display:block;}
  .status.loading{background:rgba(255,77,0,0.06);color:var(--orange2);border:1px solid rgba(255,77,0,0.2);display:block;}

  .geo-info{font-size:12px;color:var(--sub);text-align:center;margin-top:20px;position:relative;z-index:1;}
  .timestamp{font-size:11px;text-align:center;color:#444;margin-top:16px;position:relative;z-index:1;}

  .closed-card{text-align:center;padding:40px 16px;}
  .closed-icon{font-size:52px;margin-bottom:16px;}
  .closed-card h2{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:var(--error);margin-bottom:8px;}
  .closed-card p{color:var(--sub);font-size:14px;line-height:1.6;}

  .loading-card{text-align:center;padding:48px 16px;}
  .spinner{width:36px;height:36px;border:2px solid var(--border2);border-top-color:var(--orange);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-card p{color:var(--sub);font-size:13px;}
</style>
</head>
<body>

<div class="header">
  <div class="brand-mark">🏗️</div>
  <h1>Registro de<br>Asistencia</h1>
  <p id="projectName">Cargando proyecto...</p>
</div>

<div class="card" id="mainCard">
  <div class="loading-card"><div class="spinner"></div><p>Conectando...</p></div>
</div>

<div class="geo-info" id="geoInfo" style="display:none;">📍 Tu ubicación GPS será verificada antes de registrar</div>
<div class="timestamp" id="clockDisplay"></div>
<canvas id="canvasEl" style="display:none;"></canvas>

<script>
const SCRIPT_URL = "PEGA_AQUI_TU_URL_DE_GOOGLE_APPS_SCRIPT";
const SB_URL = "https://ucuxfhpncjhrbgbitveg.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjdXhmaHBuY2pocmJnYml0dmVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MDQxMzcsImV4cCI6MjA5Mjk4MDEzN30.M7GQL5tcQbN_BG7CghZp3Ny7GFaijvFL3ZYnrV4dDys";
const SBH={"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY};

async function sbFetch(path,opts={}){
  const r=await fetch(SB_URL+"/rest/v1/"+path,{...opts,headers:{...SBH,...(opts.headers||{})}});
  if(!r.ok)throw new Error(await r.text());
  const t=await r.text(); return t?JSON.parse(t):[];
}

const projId=new URLSearchParams(window.location.search).get('p');

let CONFIG={projectId:projId,projectName:"Proyecto",projectLat:9.011377,projectLng:-79.534556,radiusMeters:150,
  schedules:[{label:"Entrada",from:6,to:9,type:"entrada"},{label:"Salida",from:16,to:19,type:"salida"}]};
let EMPLOYEES=[],videoStream=null;

function updateClock(){document.getElementById('clockDisplay').textContent=new Date().toLocaleString('es-MX',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',second:'2-digit'});}
updateClock();setInterval(updateClock,1000);

async function loadAll(){
  try{
    if(projId){
      // Cargar proyecto específico
      const [projs,emps]=await Promise.all([
        sbFetch(`proyectos?id=eq.${projId}&select=*`),
        sbFetch(`empleados?select=id,nombre,pin,proyecto_id&activo=eq.true`)
      ]);
      if(projs&&projs[0]){
        const p=projs[0];
        CONFIG.projectName=p.nombre;CONFIG.projectLat=parseFloat(p.lat);
        CONFIG.projectLng=parseFloat(p.lng);CONFIG.radiusMeters=p.radio;
        CONFIG.schedules=[
          {label:"Entrada",from:p.entrada_from,to:p.entrada_to,type:"entrada"},
          {label:"Salida",from:p.salida_from,to:p.salida_to,type:"salida"}
        ];
      }
      // Empleados del proyecto + sin proyecto asignado
      EMPLOYEES=(emps||[]).filter(e=>!e.proyecto_id||e.proyecto_id===projId);
    } else {
      // Sin proyecto en URL — config general
      const[cfg,emps]=await Promise.all([
        sbFetch("config?select=clave,valor"),
        sbFetch("empleados?select=id,nombre,pin&activo=eq.true")
      ]);
      if(cfg&&cfg.length){
        const map={};cfg.forEach(r=>map[r.clave]=r.valor);
        if(map.projectName){
          CONFIG.projectName=map.projectName;CONFIG.projectLat=parseFloat(map.projectLat);
          CONFIG.projectLng=parseFloat(map.projectLng);CONFIG.radiusMeters=parseFloat(map.radiusMeters);
          CONFIG.schedules=[
            {label:"Entrada",from:parseFloat(map.entradaFrom),to:parseFloat(map.entradaTo),type:"entrada"},
            {label:"Salida",from:parseFloat(map.salidaFrom),to:parseFloat(map.salidaTo),type:"salida"}
          ];
        }
      }
      EMPLOYEES=emps||[];
    }
  }catch(e){console.warn("Error cargando config:",e.message);}
  document.getElementById('projectName').textContent=CONFIG.projectName;
  renderPage();
}

function getSchedule(){const h=new Date().getHours()+new Date().getMinutes()/60;return CONFIG.schedules.find(s=>h>=s.from&&h<s.to)||null;}
function dist(la1,lo1,la2,lo2){const R=6371000,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;const a=Math.sin(dLa/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}

function renderPage(){const s=getSchedule();if(s){renderForm(s);document.getElementById('geoInfo').style.display='block';}else renderClosed();}

function renderForm(s){
  const opts=EMPLOYEES.length?EMPLOYEES.map(e=>`<option value="${e.id}">${e.nombre}</option>`).join(''):'<option value="">Sin empleados registrados</option>';
  document.getElementById('mainCard').innerHTML=`
    <div class="schedule-badge"><div class="badge-dot"></div><div><div class="badge-label">Ventana activa</div><div class="badge-val">${s.label} · ${s.from}:00 – ${s.to}:00 hrs</div></div></div>
    <div class="field"><label class="field-label">👤 Nombre</label><select id="empSelect"><option value="">Selecciona tu nombre</option>${opts}</select></div>
    <div class="field"><label class="field-label">🔑 PIN de acceso</label><input type="password" id="pinInput" placeholder="••••" maxlength="4" inputmode="numeric"></div>
    <div class="field"><label class="field-label">📸 Selfie de verificación</label>
      <div class="camera-wrap"><video id="videoEl" autoplay playsinline></video><img class="photo-preview" id="photoPreview"/>
        <div class="camera-overlay"><div class="corners"><div class="cb"></div><div class="cl"></div></div></div></div>
      <div class="camera-hint" id="camHint">Iniciando cámara frontal...</div></div>
    <button class="btn-main" id="submitBtn" onclick="submit('${s.type}','${s.label}')">Registrar ${s.label}</button>
    <div class="status" id="statusMsg"></div>`;
  startCam();
}

function renderClosed(){
  const h=new Date().getHours()+new Date().getMinutes()/60;
  const n=CONFIG.schedules.filter(s=>s.from>h).sort((a,b)=>a.from-b.from)[0];
  const msg=n?`Próxima: <strong>${n.label}</strong> a las <strong>${n.from}:00</strong>`:'No hay más ventanas hoy.';
  document.getElementById('mainCard').innerHTML=`<div class="closed-card"><div class="closed-icon">🔒</div><h2>Registro Cerrado</h2><p>Fuera del horario permitido.</p><p style="margin-top:12px;font-size:13px;">${msg}</p></div>`;
  document.getElementById('geoInfo').style.display='none';
}

function st(msg,type){const el=document.getElementById('statusMsg');if(!el)return;el.innerHTML=msg;el.className='status '+type;}

async function startCam(){
  try{videoStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
    const v=document.getElementById('videoEl');if(v){v.srcObject=videoStream;document.getElementById('camHint').textContent='La foto se tomará automáticamente al registrar';}}
  catch(e){const h=document.getElementById('camHint');if(h)h.textContent='⚠️ Activa la cámara en tu navegador';}
}

function capPhoto(){
  const v=document.getElementById('videoEl'),c=document.getElementById('canvasEl');
  if(!v?.srcObject)return null;
  c.width=v.videoWidth||320;c.height=v.videoHeight||240;
  const ctx=c.getContext('2d');ctx.translate(c.width,0);ctx.scale(-1,1);ctx.drawImage(v,0,0);
  return c.toDataURL('image/jpeg',0.7);
}

function stopCam(){if(videoStream){videoStream.getTracks().forEach(t=>t.stop());videoStream=null;}}

async function submit(type,label){
  const empId=document.getElementById('empSelect').value;
  const pin=document.getElementById('pinInput').value.trim();
  if(!empId){st('⚠️ Selecciona tu nombre.','error');return;}
  if(!pin){st('⚠️ Ingresa tu PIN.','error');return;}
  const emp=EMPLOYEES.find(e=>e.id===empId);
  if(!emp||String(emp.pin)!==String(pin)){st('❌ PIN incorrecto.','error');document.getElementById('pinInput').value='';return;}

  const btn=document.getElementById('submitBtn');btn.disabled=true;
  st('📍 Verificando ubicación...','loading');

  navigator.geolocation.getCurrentPosition(async(pos)=>{
    const{latitude:lat,longitude:lng}=pos.coords;
    const d=dist(lat,lng,CONFIG.projectLat,CONFIG.projectLng);
    if(d>CONFIG.radiusMeters){st(`❌ Estás a ${Math.round(d)}m. Necesitas estar a menos de ${CONFIG.radiusMeters}m.`,'error');btn.disabled=false;return;}

    st('📸 Tomando foto...','loading');
    const photo=capPhoto();
    if(photo){
      const prev=document.getElementById('photoPreview'),vid=document.getElementById('videoEl');
      if(prev&&vid){prev.src=photo;prev.style.display='block';vid.style.display='none';
        const ov=document.querySelector('.camera-overlay');if(ov)ov.style.display='none';
        document.getElementById('camHint').textContent='✅ Foto capturada';}
      stopCam();
    }

    st('💾 Guardando registro...','loading');

    // Subir foto a Storage
    let fotoUrl=null;
    if(photo){
      try{
        const b64=photo.replace(/^data:image\/\w+;base64,/,'');
        const bytes=atob(b64);const arr=new Uint8Array(bytes.length);
        for(let i=0;i<bytes.length;i++)arr[i]=bytes.charCodeAt(i);
        const blob=new Blob([arr],{type:'image/jpeg'});
        const fn=`${emp.nombre}_${Date.now()}.jpg`.replace(/\s+/g,'_');
        const up=await fetch(`${SB_URL}/storage/v1/object/fotos-asistencia/${fn}`,{
          method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'image/jpeg','x-upsert':'true'},body:blob
        });
        if(up.ok)fotoUrl=`${SB_URL}/storage/v1/object/public/fotos-asistencia/${fn}`;
      }catch(e){}
    }

    const now=new Date();
    const payload={nombre:emp.nombre,tipo:type,fecha:now.toLocaleDateString('es-MX'),hora:now.toLocaleTimeString('es-MX'),latitud:lat.toFixed(6),longitud:lng.toFixed(6),distancia:Math.round(d),proyecto:CONFIG.projectName,photo:photo||null};

    // Guardar en Apps Script
    try{fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});}catch(e){}

    // Guardar en Supabase
    try{
      await sbFetch("asistencia",{method:'POST',headers:{"Prefer":"return=minimal"},body:JSON.stringify({
        proyecto:CONFIG.projectName,nombre:emp.nombre,tipo:type,
        fecha:payload.fecha,hora:payload.hora,latitud:payload.latitud,
        longitud:payload.longitud,distancia:Math.round(d),
        foto_url:fotoUrl,proyecto_id:CONFIG.projectId||null
      })});
    }catch(e){console.warn("Error guardando en Supabase:",e.message);}

    st(`✅ ¡${label} registrada! Bienvenido, <strong>${emp.nombre}</strong>. ${payload.hora}`,'success');
    btn.disabled=false;
    document.getElementById('pinInput').value='';
    document.getElementById('empSelect').value='';
  },()=>{st('❌ No se pudo obtener tu ubicación.','error');btn.disabled=false;},{timeout:10000,maximumAge:0});
}

loadAll();
</script>
</body>
</html>
